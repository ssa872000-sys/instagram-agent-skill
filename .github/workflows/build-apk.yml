name: Build Android APK

on:
  push:
    paths:
      - 'puzzle-game-android/**'
      - '.github/workflows/build-apk.yml'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: puzzle-game-android
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4

      - name: Build debug APK
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon

      - name: Rename APK
        run: cp app/build/outputs/apk/debug/app-debug.apk pyatnashki.apk

      - uses: actions/upload-artifact@v4
        with:
          name: pyatnashki-apk
          path: puzzle-game-android/pyatnashki.apk
