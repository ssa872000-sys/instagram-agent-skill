<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>Пятнашки</title>
<style>
  :root {
    --bg1: #1e1b4b; --bg2: #4c1d95;
    --panel: rgba(255,255,255,0.10);
    --text: #f8fafc; --muted: #c4b5fd;
    --tile1: #f472b6; --tile2: #fb923c;
    --accent: #facc15;
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; user-select: none; }
  html, body { margin: 0; height: 100%; }
  body {
    background: linear-gradient(160deg, var(--bg1), var(--bg2));
    color: var(--text);
    font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    display: flex; flex-direction: column; align-items: center;
    padding: max(16px, env(safe-area-inset-top)) 16px 16px;
    overflow: hidden; touch-action: none;
  }
  h1 { margin: 8px 0 4px; font-size: 32px; letter-spacing: 1px; }
  .sub { color: var(--muted); margin: 0 0 14px; font-size: 14px; text-align: center; }
  .sizes { display: flex; gap: 8px; margin-bottom: 14px; }
  .sizes button, .btn {
    border: 0; border-radius: 12px; padding: 10px 16px; font-size: 16px; font-weight: 600;
    background: var(--panel); color: var(--text); cursor: pointer;
  }
  .sizes button.active { background: var(--accent); color: #1e1b4b; }
  .stats { display: flex; gap: 10px; margin-bottom: 14px; width: 100%; max-width: 420px; }
  .stat { flex: 1; background: var(--panel); border-radius: 12px; padding: 8px; text-align: center; }
  .stat b { display: block; font-size: 22px; }
  .stat span { font-size: 12px; color: var(--muted); }
  #board {
    position: relative; width: min(92vw, 420px, 62vh); aspect-ratio: 1;
    background: rgba(0,0,0,0.25); border-radius: 18px; padding: 6px;
  }
  .tile {
    position: absolute; display: flex; align-items: center; justify-content: center;
    border-radius: 12px; font-weight: 800; color: #fff;
    background: linear-gradient(145deg, var(--tile1), var(--tile2));
    box-shadow: 0 4px 0 rgba(0,0,0,0.25);
    transition: transform 0.12s ease-out;
    text-shadow: 0 2px 2px rgba(0,0,0,0.25);
  }
  .tile.ok { background: linear-gradient(145deg, #34d399, #22d3ee); }
  #board.instant .tile { transition: none; }
  .actions { margin-top: 16px; display: flex; gap: 10px; }
  .btn.primary { background: var(--accent); color: #1e1b4b; }
  #win {
    position: fixed; inset: 0; background: rgba(15,10,40,0.85);
    display: none; align-items: center; justify-content: center; flex-direction: column; text-align: center;
    padding: 16px;
  }
  #win.show { display: flex; }
  #win h2 { font-size: 34px; margin: 0 0 8px; }
  #win p { color: var(--muted); font-size: 18px; margin: 4px 0; }
  #win .rec { color: var(--accent); font-weight: 700; }
</style>
</head>
<body>
  <h1>Пятнашки</h1>
  <p class="sub">Расставь числа по порядку. Нажми или смахни плитку.</p>

  <div class="sizes" id="sizes">
    <button data-n="3">3×3</button>
    <button data-n="4">4×4</button>
    <button data-n="5">5×5</button>
  </div>

  <div class="stats">
    <div class="stat"><b id="moves">0</b><span>ходов</span></div>
    <div class="stat"><b id="time">0:00</b><span>время</span></div>
    <div class="stat"><b id="best">—</b><span>рекорд</span></div>
  </div>

  <div id="board"></div>

  <div class="actions">
    <button class="btn primary" id="shuffle">Новая игра</button>
  </div>

  <div id="win">
    <h2>Победа! 🎉</h2>
    <p id="winText"></p>
    <p class="rec" id="winRec"></p>
    <div class="actions"><button class="btn primary" id="again">Играть ещё</button></div>
  </div>

<script>
(function () {
  var n = 4, tiles = [], empty = 0, moves = 0, seconds = 0, timer = null, started = false, won = false;
  var board = document.getElementById('board');
  var els = [];

  function store(key, val) {
    try { if (val === undefined) return localStorage.getItem(key); localStorage.setItem(key, val); } catch (e) { return null; }
  }
  function fmt(s) { return Math.floor(s / 60) + ':' + String(s % 60).padStart(2, '0'); }
  function bestKey() { return 'best_' + n; }
  function showBest() {
    var b = store(bestKey());
    document.getElementById('best').textContent = b ? JSON.parse(b).moves : '—';
  }

  function build() {
    board.innerHTML = '';
    els = [];
    for (var v = 1; v < n * n; v++) {
      var el = document.createElement('div');
      el.className = 'tile';
      el.textContent = v;
      el.dataset.v = v;
      el.addEventListener('pointerdown', onTileDown);
      board.appendChild(el);
      els[v] = el;
    }
    // Place new tiles at once; otherwise they slide in from the corner and overlap.
    board.classList.add('instant');
    layout();
    void board.offsetWidth;
    board.classList.remove('instant');
  }

  function layout() {
    var size = board.clientWidth - 12, cell = size / n, gap = Math.max(4, cell * 0.06);
    for (var i = 0; i < tiles.length; i++) {
      var v = tiles[i];
      if (!v) continue;
      var el = els[v], r = Math.floor(i / n), c = i % n;
      el.style.width = el.style.height = (cell - gap) + 'px';
      el.style.left = el.style.top = (6 + gap / 2) + 'px';
      el.style.fontSize = (cell * 0.4) + 'px';
      el.style.transform = 'translate(' + (c * cell) + 'px,' + (r * cell) + 'px)';
      el.classList.toggle('ok', v === i + 1);
    }
  }

  function neighbors(i) {
    var r = Math.floor(i / n), c = i % n, out = [];
    if (r > 0) out.push(i - n);
    if (r < n - 1) out.push(i + n);
    if (c > 0) out.push(i - 1);
    if (c < n - 1) out.push(i + 1);
    return out;
  }

  // Shuffle by random legal moves from the solved state, so every layout is solvable.
  function shuffle() {
    tiles = [];
    for (var i = 1; i < n * n; i++) tiles.push(i);
    tiles.push(0);
    empty = n * n - 1;
    var prev = -1, steps = n * n * 40;
    for (var s = 0; s < steps; s++) {
      var opts = neighbors(empty).filter(function (x) { return x !== prev; });
      var pick = opts[Math.floor(Math.random() * opts.length)];
      tiles[empty] = tiles[pick]; tiles[pick] = 0;
      prev = empty; empty = pick;
    }
    if (solved()) return shuffle();
    moves = 0; seconds = 0; started = false; won = false;
    clearInterval(timer);
    document.getElementById('moves').textContent = '0';
    document.getElementById('time').textContent = '0:00';
    document.getElementById('win').classList.remove('show');
    build();
    showBest();
  }

  function solved() {
    for (var i = 0; i < n * n - 1; i++) if (tiles[i] !== i + 1) return false;
    return true;
  }

  // Move the tile at index i (and any tiles between it and the empty cell in the same row/column).
  function tryMove(i) {
    if (won) return;
    var er = Math.floor(empty / n), ec = empty % n, r = Math.floor(i / n), c = i % n, step;
    if (r === er && c !== ec) step = c < ec ? -1 : 1;
    else if (c === ec && r !== er) step = r < er ? -n : n;
    else return;
    while (empty !== i) {
      var next = empty + step;
      tiles[empty] = tiles[next]; tiles[next] = 0; empty = next;
      moves++;
    }
    if (!started) {
      started = true;
      timer = setInterval(function () { seconds++; document.getElementById('time').textContent = fmt(seconds); }, 1000);
    }
    if (navigator.vibrate) { try { navigator.vibrate(10); } catch (e) {} }
    document.getElementById('moves').textContent = moves;
    layout();
    if (solved()) finish();
  }

  function finish() {
    won = true;
    clearInterval(timer);
    var prev = store(bestKey()), rec = '';
    if (!prev || moves < JSON.parse(prev).moves) {
      store(bestKey(), JSON.stringify({ moves: moves, time: seconds }));
      rec = 'Новый рекорд!';
    }
    document.getElementById('winText').textContent = 'Поле ' + n + '×' + n + ': ' + moves + ' ходов за ' + fmt(seconds);
    document.getElementById('winRec').textContent = rec;
    showBest();
    setTimeout(function () { document.getElementById('win').classList.add('show'); }, 250);
  }

  // Tap or swipe on a tile.
  var downX, downY, downIdx;
  function onTileDown(e) {
    downX = e.clientX; downY = e.clientY;
    downIdx = tiles.indexOf(+e.currentTarget.dataset.v);
  }
  document.addEventListener('pointerup', function (e) {
    if (downIdx === undefined) return;
    var i = downIdx; downIdx = undefined;
    var dx = e.clientX - downX, dy = e.clientY - downY;
    if (Math.abs(dx) < 15 && Math.abs(dy) < 15) { tryMove(i); return; }
    // Swipe: only move when it points toward the empty cell.
    var er = Math.floor(empty / n), ec = empty % n, r = Math.floor(i / n), c = i % n;
    if (Math.abs(dx) > Math.abs(dy)) {
      if (r === er && ((dx > 0 && ec > c) || (dx < 0 && ec < c))) tryMove(i);
    } else {
      if (c === ec && ((dy > 0 && er > r) || (dy < 0 && er < r))) tryMove(i);
    }
  });

  document.getElementById('sizes').addEventListener('click', function (e) {
    var b = e.target.closest('button');
    if (!b) return;
    n = +b.dataset.n;
    store('size', n);
    markSize();
    shuffle();
  });
  function markSize() {
    document.querySelectorAll('#sizes button').forEach(function (b) { b.classList.toggle('active', +b.dataset.n === n); });
  }
  document.getElementById('shuffle').addEventListener('click', shuffle);
  document.getElementById('again').addEventListener('click', shuffle);
  window.addEventListener('resize', layout);

  var saved = +store('size');
  if (saved >= 3 && saved <= 5) n = saved;
  markSize();
  shuffle();

  // Hook for tests.
  window.__game = { get tiles() { return tiles.slice(); }, get n() { return n; }, tryMove: tryMove };
})();
</script>
</body>
</html>
